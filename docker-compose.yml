version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rca_postgres
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca_dev_password
      POSTGRES_DB: rca_framework
    ports:
      - "5432:5432"
    volumes:
      - rca_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca_framework"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: rca_backend
    environment:
      DATABASE_URL: postgresql://rca:rca_dev_password@postgres:5432/rca_framework
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: rca_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  rca_pg_data:
